<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="input.js"></script>
<title>Space Sim</title>
</head>
<body>

<canvas id="canvas" width="800" height="800" style="border: 4px solid black; margin: auto; display: block;"></canvas>

<script>
var c;		// Canvas
var ctx;	// Context

var W;	// Width
var H;	// Height

var time, diff;

var objs = [];


function setup() {
	c = document.getElementById("canvas"); //$("#canvas");
	ctx = c.getContext("2d");
	
	W = c.width;
	H = c.height;
	
	console.log("Width: " + W + " Height: " + H);
	
	objs.push(new player([W/2,H/2],10, [0,1]))
	
	//game();
}

function game() {
	//
	window.requestAnimationFrame(game);// Causes loop
	
	var t = Date.now();
	diff = t - time;
	time = t;
	//console.log(diff);
	sim();
	draw();
}

function sim() {
	for (var i = 0; i < objs.length; i++) {
		//objs[i].pos[0] += objs[i].vel[0] * diff/1;
		//objs[i].pos[1] += objs[i].vel[1] * diff/10000;
		//console.log(objs[i].pos[0]);
	}
}

function draw() {
	// Background
	ctx.fillStyle = "#030322";
	ctx.fillRect(0, 0, W, H);
	
	//var obj = new player([W/2,H/2],10, [0,1]);
	
	// Each Polygon
	for (var p = 0; p < objs[0].poly.length; p++) {
		ctx.beginPath();
		ctx.moveTo( (objs[0].poly[p].vert[0][0] * objs[0].size)+objs[0].pos[0], (objs[0].poly[p].vert[0][1] * objs[0].size)+objs[0].pos[1]);
		// Each Vertex
		for (var v = 1; v < objs[0].poly[p].vert.length; v++) {
			ctx.lineTo((objs[0].poly[p].vert[v][0] * objs[0].size)+objs[0].pos[0], (objs[0].poly[p].vert[v][1] * objs[0].size)+objs[0].pos[1]);
		}
		ctx.lineTo((objs[0].poly[p].vert[0][0] * objs[0].size)+objs[0].pos[0], (objs[0].poly[p].vert[0][1] * objs[0].size)+objs[0].pos[1]);
		
		ctx.strokeStyle = objs[0].poly[p].color;
		ctx.stroke();
		
		ctx.fillStyle = objs[0].poly[p].color;
		ctx.fill();
	}
	ctx.closePath();
}

class poly {
	constructor() {
		//
		this.vert = [];
		this.color;
		this.line;
	}
}

class player {
	constructor(pos,size,dir) {
		//
		//var p = {'vert':[],'color':""};
		this.pos = pos;
		this.size = size;
		this.dir = dir;
		this.vel = [1.0,1.0];
		
		this.poly = [];
		this.poly[0] = new poly();
		this.poly[0].vert[0] = [0,4];
		this.poly[0].vert[1] = [1,2];
		this.poly[0].vert[2] = [-1,2];
		this.poly[0].color = "#FF0000";
		
		this.poly[1] = new poly();
		this.poly[1].vert[0] = [1,2];
		this.poly[1].vert[1] = [-1,2];
		this.poly[1].vert[2] = [-1,-2];
		this.poly[1].vert[3] = [1,-2];
		this.poly[1].color = "#FFFFFF";
		
		this.poly[2] = new poly();
		this.poly[2].vert[0] = [1,-2];
		this.poly[2].vert[1] = [-1,-2];
		this.poly[2].vert[2] = [-2,-3];
		this.poly[2].vert[3] = [2,-3];
		this.poly[2].color = "#0000FF";
	}
}

setup();
game();
</script>
</body>
